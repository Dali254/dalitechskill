<!DOCTYPE html>
<html lang="en" data-pattern="profiz" data-kind="solid" data-ghost="outline">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0d16" media="(prefers-color-scheme: dark)">
<script src="sr-boot.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sunrise.css">
<script src="sunrise.js" defer></script>
<title>Create account — Sunrise starter</title>
<meta name="description" content="It takes less than a minute.">
</head>
<body class="sr-authpage" >
<div class="sr-auth">
  <aside class="sr-auth__aside" aria-hidden="true">
    <img src="i3d/wallet.webp" alt="" width="240" height="240">
    <h2>Invited by amina.k</h2><p>Join free. Your referral is saved automatically — no code to type.</p>
  </aside>
  <main class="sr-auth__main">
    <div class="sr-auth__card">
      <div class="sr-auth__brand"><span class="sr-logo"><svg class="sr-ic" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h14a2 2 0 0 1 2 2v1a2 2 0 0 1-2 2H3M7 6V5a2 2 0 0 1 2-2h7"/></svg></span><b class="sr-brand">NOVAPAL</b>
        <button class="sr-iconbtn" type="button" data-mode-toggle aria-label="Switch light or dark mode" style="margin-left:auto"><svg class="sr-ic" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button></div>
      <h1>Create your account</h1>
      <p class="sr-lead">It takes less than a minute.</p>
      <form action="index.html">
      <div class="sr-field"><label class="sr-label" for="name">Username</label><input class="sr-input" id="name" name="username" autocomplete="username" required></div>
      <div class="sr-field"><label class="sr-label" for="phone">Phone number</label>
        <div class="sr-inputgroup"><span class="sr-inputgroup__addon">+254</span><input class="sr-input" id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="712 345 678" required></div></div>
      <div class="sr-field"><label class="sr-label" for="email">Email <span class="sr-muted">(optional)</span></label><input class="sr-input" id="email" name="email" type="email" autocomplete="email"></div>
      <div class="sr-field"><label class="sr-label" for="password">Password</label>
        <div class="sr-inputgroup"><input class="sr-input" id="password" name="password" type="password" autocomplete="new-password" required minlength="6">
        <button class="sr-inputgroup__addon" type="button" data-pass-toggle aria-label="Show password" aria-pressed="false"><svg class="sr-ic" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
      <p class="sr-help" style="margin-top:-.5rem">At least 6 characters.</p>
      <input type="hidden" name="ref" value="AMINA">
      <label class="sr-check"><input type="checkbox" required> I agree to the <a href="#">terms</a></label>
      <button class="sr-btn sr-btn--block" type="submit">Create account</button>
    </form>
      <p class="sr-small sr-muted" style="text-align:center">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </main>
</div>
<div class="sr-toasts" aria-live="polite"></div>
</body>
</html>
